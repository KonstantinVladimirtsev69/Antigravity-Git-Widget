<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Widget</title>
    <script>
      (function () {
        var bridge = {
          workspaceUris: [],
          listeners: new Set(),
          subscribe: function (fn) {
            bridge.listeners.add(fn);
            if (bridge.workspaceUris.length > 0) {
              try { fn(bridge.workspaceUris); } catch (_) {}
            }
            return function () { bridge.listeners.delete(fn); };
          }
        };
        window.__gwBridge = bridge;
        window.addEventListener('message', function (event) {
          var d = event && event.data;
          if (!d) return;
          if (d.type === 'theme-change' && d.payload && d.payload.cssVariables) {
            var vars = d.payload.cssVariables;
            for (var k in vars) {
              if (Object.prototype.hasOwnProperty.call(vars, k)) {
                document.documentElement.style.setProperty(k, vars[k]);
              }
            }
          } else if (d.type === 'workspace-change' && d.payload) {
            var uris = Array.isArray(d.payload.workspaceUris) ? d.payload.workspaceUris : [];
            bridge.workspaceUris = uris;
            bridge.listeners.forEach(function (fn) {
              try { fn(uris); } catch (_) {}
            });
          }
        });
      })();
    </script>
  </head>
  <body style="margin:0;padding:10px;background:var(--background,#131316);color:var(--foreground,#e4e4e7);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;">
    <div id="root">Загрузка Git Widget...</div>
    <script>
      window.addEventListener('error', function(e) {
        var r = document.getElementById('root');
        if (r && r.innerText === 'Загрузка Git Widget...') r.innerText = 'JS Error: ' + (e.message || e.error);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

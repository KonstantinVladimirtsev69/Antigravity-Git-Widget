<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Widget</title>
  </head>
  <body style="margin:0;padding:10px;background:var(--background,#18181b);color:var(--foreground,#f4f4f5);font-family:sans-serif;font-size:12px;">
    <div id="root">Загрузка Git Widget...</div>
    <script>
      window.addEventListener('error', function(e) {
        var r = document.getElementById('root');
        if (r) r.innerText = 'JS Error: ' + (e.message || e.error);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = document.getElementById('root');
        if (r && r.innerText === 'Загрузка Git Widget...') r.innerText = 'Promise Error: ' + e.reason;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 530" width="420" height="530">
  <rect width="420" height="530" rx="12" fill="#121215" stroke="#27272f" stroke-width="1.5"/>
  <!-- Header -->

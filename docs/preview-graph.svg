  <text x="377" y="143" fill="#d4d4d8" font-family="Segoe UI, sans-serif" font-size="11">⌫</text>

  <rect x="24" y="158" width="118" height="26" rx="6" fill="#22222a" stroke="#2c2c35"/>
  <text x="68" y="175" fill="#d4d4d8" font-family="Segoe UI, sans-serif" font-size="11.5">Fetch</text>

  <text x="28" y="346" fill="#f4f4f5" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="500">github.rs</text>
  <text x="86" y="346" fill="#7c7f8a" font-family="Segoe UI, sans-serif" font-size="10.5">crates/git-widget-core/src</text>
  <text x="384" y="346" fill="#73c991" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">U</text>


  <line x1="30" y1="400" x2="30" y2="495" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 30 425 C 30 438, 44 435, 44 450 L 44 475 C 44 488, 30 485, 30 495" stroke="#f97316" stroke-width="2" fill="none"/>
  <circle cx="30" cy="402" r="4" fill="#121215" stroke="#3b82f6" stroke-width="2.2"/>
  <circle cx="30" cy="426" r="3.5" fill="#3b82f6"/>
  <circle cx="44" cy="450" r="3.5" fill="#f97316"/>
  <circle cx="44" cy="474" r="3.5" fill="#f97316"/>
  <circle cx="30" cy="498" r="3.5" fill="#3b82f6"/>

  <text x="58" y="406" fill="#f4f4f5" font-family="Segoe UI, sans-serif" font-size="11.5">feat(graph): add SVG commit graph &amp; PRs</text>
  <rect x="278" y="394" width="76" height="16" rx="8" fill="#1e293b" stroke="#3b82f6"/>

  <rect x="168" y="367" width="44" height="17" rx="8" fill="#1f1f27" stroke="#2c2c35"/>
  <text x="176" y="379" fill="#d4d4d8" font-family="Segoe UI, sans-serif" font-size="10">Alex 14</text>


[package]
name = "git-widget-sidecar"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
git-widget-core = { path = "../git-widget-core" }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
